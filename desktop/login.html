<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><link rel="stylesheet" href="style.css"><title>净元 · 文件元数据清理</title></head><body class="client-login-page"><main class="client-login-shell"><div class="brand"><span data-icon="diamond"></span><span>净元</span></div><p class="login-tagline">文件元数据清理 · 团队工作空间</p><section id="auth" class="panel auth-card"><h2>登录你的工作空间</h2><p>连接账号服务，开始自动清理文件元数据。</p><form id="authform"><label>服务地址<input id="server" type="text" inputmode="url" placeholder="192.168.10.10:8787" autocomplete="url" spellcheck="false" required></label><p class="server-address-hint">默认内网：192.168.10.10:8787 · 外网：203.0.113.10:8787</p><p id="server-security" class="server-address-hint" hidden></p><div class="grid"><label>账号<input id="username" autocomplete="username" required></label><label>姓名（注册时必填）<input id="name" autocomplete="name"></label></div><label>密码<input id="password" type="password" autocomplete="current-password" required></label><div class="toolbar"><button id="login" type="submit">登录</button><button id="register" class="secondary" type="button">注册并登录</button></div></form><div class="auth-tools"><span class="hint muted">统计统一同步到团队服务器。</span><button id="diagnose" class="ghost small">检查连接</button></div></section><p id="status" role="status" aria-live="polite"></p><div class="login-bottom"><span id="login-version"></span><button id="login-update" class="ghost small">检查升级</button></div></main><script src="ui.js"></script><script src="login.js"></script></body></html>
