<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><link rel="stylesheet" href="style.css?v=1.6.5-web"><title>净元 · 统计控制台</title></head><body class="login-page"><main class="login-shell"><div class="brand"><span data-icon="diamond"></span><span>净元</span></div><section id="auth" class="panel auth-card"><h2>管理员登录</h2><p>查看团队清理统计与成员每日处理记录。</p><form id="authform"><label>账号<input name="username" id="username" value="admin" autocomplete="username" required></label><label for="password">密码</label><div class="login-password-field"><svg class="password-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input name="password" id="password" type="password" autocomplete="current-password" required><button type="button" id="reveal" class="password-reveal" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div><label class="remember-option"><input id="remember" type="checkbox">记住密码</label><p class="hint" id="remember-hint">勾选后在当前浏览器本地明文保存账号和密码，下次登录自动填入。共用电脑请勿勾选。</p><button id="login" class="primary-wide" type="submit">进入控制台</button></form><p class="hint">登录状态会保留，有效期最长30天。使用共用电脑后请退出登录。</p></section><p id="status" role="status"></p></main><script src="ui.js?v=1.5.0"></script><script src="login.js?v=1.6.5-web"></script></body></html>
